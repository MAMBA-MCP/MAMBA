[project]
name = "mamba-mcp"
version = "0.1.0"
description = "MCP-enabled Autonomous MAVLink-M Bridge for AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2,<3",
    "mavsdk>=4.0.6,<5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
simulation = [
    "pymavlink==2.4.49",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
